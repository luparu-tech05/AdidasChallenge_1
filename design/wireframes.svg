<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Inventory synchronization React route wireframes</title>
  <desc id="desc">Three low-fidelity screens for the inventory, product detail, and alerts routes.</desc>
  <defs>
    <style>
      .bg{fill:#f4f5f7}.panel{fill:#fff;stroke:#171717;stroke-width:2}.ink{fill:#171717}.muted{fill:#62666d}
      .accent{fill:#d9ff43}.soft{fill:#eceef1}.line{stroke:#171717;stroke-width:2}.thin{stroke:#a7abb2;stroke-width:1}
      .h1{font:700 28px Arial,sans-serif}.h2{font:700 20px Arial,sans-serif}.body{font:15px Arial,sans-serif}
      .small{font:13px Arial,sans-serif}.tiny{font:11px Arial,sans-serif}.label{font:700 12px Arial,sans-serif;letter-spacing:1px}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1050"/>
  <text x="55" y="55" class="h1 ink">STORE INVENTORY SYNC - UX WIREFRAMES</text>
  <text x="55" y="82" class="body muted">React route wireframes - fictional demo data - no official brand assets</text>

  <!-- Screen 1 -->
  <g transform="translate(55 120)">
    <rect class="panel" width="710" height="420" rx="8"/>
    <rect class="ink" width="710" height="56" rx="6"/>
    <text x="22" y="35" class="h2" fill="#fff">Network inventory</text>
    <text x="590" y="34" class="small" fill="#fff">/inventory</text>
    <rect x="22" y="78" width="280" height="40" rx="4" class="soft"/>
    <text x="38" y="103" class="body muted">Search SKU or product</text>
    <rect x="314" y="78" width="170" height="40" rx="4" class="soft"/>
    <text x="330" y="103" class="body ink">All stores v</text>
    <rect x="496" y="78" width="192" height="40" rx="4" class="accent"/>
    <text x="512" y="103" class="body ink">Network stock &lt;= 5</text>
    <text x="22" y="153" class="label ink">PRODUCT</text>
    <text x="370" y="153" class="label ink">NETWORK</text>
    <text x="470" y="153" class="label ink">STORES</text>
    <text x="585" y="153" class="label ink">STATUS</text>
    <line x1="22" y1="165" x2="688" y2="165" class="line"/>
    <text x="22" y="198" class="body ink">SAMBA-OG-WHT-42</text>
    <text x="22" y="219" class="small muted">Samba OG / Footwear</text>
    <text x="390" y="205" class="h2 ink">5</text>
    <text x="491" y="205" class="body ink">3 / 3</text>
    <circle cx="595" cy="199" r="7" class="accent"/><text x="610" y="205" class="small ink">Low stock</text>
    <line x1="22" y1="238" x2="688" y2="238" class="thin"/>
    <text x="22" y="271" class="body ink">PREDATOR-ELITE-FG-43</text>
    <text x="22" y="292" class="small muted">Predator Elite / Football</text>
    <text x="382" y="278" class="h2 ink">24</text>
    <text x="491" y="278" class="body ink">3 / 3</text>
    <text x="610" y="278" class="small ink">Healthy</text>
    <line x1="22" y1="311" x2="688" y2="311" class="thin"/>
    <text x="22" y="345" class="body ink">ADIZERO-BOSTON-13-40</text>
    <text x="22" y="366" class="small muted">Adizero Boston 13 / Running</text>
    <text x="390" y="352" class="h2 ink">4</text>
    <text x="491" y="352" class="body ink">1 / 3</text>
    <circle cx="595" cy="346" r="7" class="accent"/><text x="610" y="352" class="small ink">Low stock</text>
    <text x="22" y="404" class="tiny muted">3 products shown / filters remain visible and removable</text>
  </g>

  <!-- Screen 2 -->
  <g transform="translate(835 120)">
    <rect class="panel" width="710" height="420" rx="8"/>
    <rect class="ink" width="710" height="56" rx="6"/>
    <text x="22" y="35" class="h2" fill="#fff">SAMBA-OG-WHT-42</text>
    <text x="525" y="34" class="small" fill="#fff">/products/:sku</text>
    <rect x="22" y="80" width="205" height="92" class="soft" rx="4"/>
    <text x="38" y="108" class="label muted">NETWORK TOTAL</text>
    <text x="38" y="148" class="h1 ink">5 units</text>
    <rect x="241" y="80" width="205" height="92" class="accent" rx="4"/>
    <text x="257" y="108" class="label ink">ALERT</text>
    <text x="257" y="145" class="h2 ink">Open / threshold 5</text>
    <rect x="460" y="80" width="228" height="92" class="soft" rx="4"/>
    <text x="476" y="108" class="label muted">LAST MOVEMENT</text>
    <text x="476" y="142" class="body ink">OUT 5 / 16:41</text>
    <text x="22" y="208" class="h2 ink">Store balance</text>
    <text x="22" y="239" class="body ink">BOG-CALLE82</text><rect x="180" y="225" width="270" height="18" class="soft"/><rect x="180" y="225" width="34" height="18" class="ink"/><text x="470" y="239" class="body ink">1</text>
    <text x="22" y="275" class="body ink">MDE-ELPOBLADO</text><rect x="180" y="261" width="270" height="18" class="soft"/><rect x="180" y="261" width="101" height="18" class="ink"/><text x="470" y="275" class="body ink">3</text>
    <text x="22" y="311" class="body ink">CLO-JARDIN</text><rect x="180" y="297" width="270" height="18" class="soft"/><rect x="180" y="297" width="34" height="18" class="accent"/><text x="470" y="311" class="body ink">1</text>
    <line x1="22" y1="335" x2="688" y2="335" class="thin"/>
    <text x="22" y="365" class="label ink">RECENT MOVEMENTS</text>
    <text x="22" y="394" class="small ink">16:41 / BOG-CALLE82 / OUT 5 / balance 1</text>
    <text x="360" y="394" class="small muted">Idempotency replay verified</text>
  </g>

  <!-- Screen 3 -->
  <g transform="translate(55 595)">
    <rect class="panel" width="1490" height="390" rx="8"/>
    <rect class="ink" width="1490" height="56" rx="6"/>
    <text x="22" y="35" class="h2" fill="#fff">Low-stock alerts  /alerts</text>
    <rect x="22" y="82" width="150" height="38" class="accent" rx="19"/>
    <text x="58" y="106" class="body ink">Open (2)</text>
    <rect x="184" y="82" width="150" height="38" class="soft" rx="19"/>
    <text x="218" y="106" class="body ink">Resolved</text>
    <text x="22" y="160" class="label ink">PRODUCT</text>
    <text x="410" y="160" class="label ink">SCOPE</text>
    <text x="670" y="160" class="label ink">OBSERVED / THRESHOLD</text>
    <text x="1020" y="160" class="label ink">OPENED</text>
    <text x="1290" y="160" class="label ink">ACTION</text>
    <line x1="22" y1="173" x2="1468" y2="173" class="line"/>
    <text x="22" y="215" class="body ink">SAMBA-OG-WHT-42</text>
    <text x="410" y="215" class="body ink">Network</text>
    <text x="670" y="215" class="h2 ink">5 / 5</text>
    <text x="1020" y="215" class="body ink">Today, 16:41</text>
    <rect x="1290" y="190" width="155" height="38" class="ink" rx="4"/>
    <text x="1318" y="214" class="body" fill="#fff">View product</text>
    <line x1="22" y1="245" x2="1468" y2="245" class="thin"/>
    <text x="22" y="287" class="body ink">ADIZERO-BOSTON-13-40</text>
    <text x="410" y="287" class="body ink">Network</text>
    <text x="670" y="287" class="h2 ink">4 / 5</text>
    <text x="1020" y="287" class="body ink">Today, 15:08</text>
    <rect x="1290" y="262" width="155" height="38" class="ink" rx="4"/>
    <text x="1318" y="286" class="body" fill="#fff">View product</text>
    <text x="22" y="350" class="small muted">Status is communicated through text, icon, and contrast - not color alone.</text>
  </g>
</svg>
